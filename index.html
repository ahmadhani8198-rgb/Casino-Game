<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>الحكم الإلكتروني</title>
<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0f6b5c"><link rel="apple-touch-icon" href="/icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="الحكم">
<style>
:root{--bg:#f3efe6;--card:#fffdf8;--ink:#1d2a2a;--mute:#6b7773;--acc:#0f6b5c;--line:#d9d2c3;--bad:#c0392b;--ok:#1e8e5a;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#14201f;--card:#1c2c2a;--ink:#f1ede2;--mute:#9db0ab;--acc:#4fc3a8;--line:#33504b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,"Segoe UI",Tahoma,Arial,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:720px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
h1{margin:6px 0;font-size:1.5rem}.mute{color:var(--mute)}.err{color:var(--bad);min-height:1.3em;text-align:center}
input,textarea{font:inherit;font-size:1.1rem;padding:12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);width:100%}
textarea{min-height:200px;line-height:1.7}
button{font:inherit;font-weight:700;font-size:1.1rem;padding:14px 18px;border:0;border-radius:14px;background:var(--acc);color:var(--bg);cursor:pointer}
button.g{background:transparent;color:var(--ink);border:2px solid var(--line)}button.bad{background:var(--bad);color:#fff}button.ok{background:var(--ok);color:#fff}button:disabled{opacity:.45}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px}
.code{font-size:2.4rem;letter-spacing:.3rem;text-align:center;font-weight:800;color:var(--acc)}
.pl{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border:2px solid var(--line);border-radius:12px;background:var(--card)}
.pl.me{border-color:var(--acc)}.pl.buz{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc)}.pl.off{opacity:.5}.pl b{font-size:1.5rem;color:var(--acc)}
.sb{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.q{text-align:center;font-size:clamp(1.5rem,5.5vw,2.4rem);font-weight:700;line-height:1.5;min-height:140px;display:flex;align-items:center;justify-content:center}
.cat{align-self:center;background:var(--acc);color:var(--bg);padding:4px 16px;border-radius:99px;font-weight:700}
.bell{font-size:2rem;padding:30px;width:100%}.big{font-size:2.4rem;text-align:center;font-weight:800}
.chip{border-radius:99px;background:var(--card);color:var(--ink);border:2px solid var(--acc)}
</style></head><body><main id="app"></main>
<script>
let inst=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();inst=e;if(!S)render();});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
let ws,S=null,me=localStorage.pid||'',code=localStorage.code||'',err='',dl=0,prev={};
const $=id=>document.getElementById(id),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function tx(o){if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));else{err='جاري الاتصال… جرب بعد ثانية';render();}}
function connect(){ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 ws.onopen=()=>{if(code&&me)tx({t:'join',code,pid:me,name:localStorage.name||''});};
 ws.onmessage=e=>{const m=JSON.parse(e.data);
  if(m.type==='error'){err=m.msg;if(m.fatal){localStorage.removeItem('code');code='';S=null;}render();return;}
  if(m.type==='joined'){me=m.pid;code=m.code;localStorage.pid=me;localStorage.code=code;return;}
  sound(m);hooks(m);S=m;err='';dl=Date.now()+m.left;render();};
 ws.onclose=()=>setTimeout(connect,1500);}
setInterval(()=>tx({t:'ping'}),25000);
let pr={speak:localStorage.sp!=='0',mic:localStorage.mc!=='0'},listening=false,rec,lastQ='';
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(window.speechSynthesis)speechSynthesis.getVoices();
let tts='';
const getAr=()=>window.speechSynthesis?speechSynthesis.getVoices().find(v=>/^ar/i.test(v.lang)):null;
function speakQ(t,manual){const done=()=>{if(!manual)tx({t:'readdone'});};
 if(!window.speechSynthesis){tts='متصفحك ما بيدعم القراءة الصوتية';render();done();return;}
 if(!pr.speak&&!manual){setTimeout(done,300);return;}
 const go=()=>{const v=getAr(),n=speechSynthesis.getVoices().length,u=new SpeechSynthesisUtterance(t);let started=false;
  u.lang='ar-SA';if(v)u.voice=v;u.rate=.95;
  u.onstart=()=>{started=true;tts='';render();};u.onend=done;
  u.onerror=ev=>{tts='تعذّر تشغيل الصوت ('+ev.error+'، '+n+' أصوات). اضغط «اسمع السؤال»';render();done();};
  try{if(speechSynthesis.speaking||speechSynthesis.pending)speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){done();return;}
  setTimeout(()=>{if(!started){tts='الصوت ما بدأ ('+n+' أصوات'+(v?'':'، ما في صوت عربي')+'). اضغط «اسمع السؤال»';render();done();}},2500);};
 if(speechSynthesis.getVoices().length)go();else{let d=0;const f=()=>{if(!d++)go();};speechSynthesis.onvoiceschanged=f;setTimeout(f,1200);}}
function hooks(m){if(m.phase==='answering'&&m.buzzer===m.me)gotTurn=true;
 if(rec&&want&&((m.buzzer&&m.buzzer!==m.me)||(gotTurn&&!(m.phase==='answering'&&m.buzzer===m.me))))stopMic();
 if(m.phase==='reading'&&m.q){const k=m.code+':'+m.n;if(k!==lastQ){lastQ=k;tts='';speakQ(m.q.text);}}}
let sent=false,prevT='',idle,lastV='',lastT=0,gotTurn=false,want=false,retryAt=0;
function stopMic(){want=false;listening=false;clearTimeout(idle);try{rec&&rec.abort();}catch(e){}}
function sendVoice(texts,fin){if(sent)return;if(fin){sent=true;stopMic();}tx({t:'voice',text:texts[0],alts:texts.slice(1),final:fin});}
function listen(more){if(!SR)return;if(!more){try{rec&&rec.abort();}catch(e){}}
 let r;try{r=new SR();}catch(e){return;}rec=r;if(!more){sent=false;prevT='';lastV='';gotTurn=false;}
 want=true;r.lang='ar-SA';r.continuous=true;r.interimResults=true;r.maxAlternatives=3;listening=true;
 const keep=()=>{prevT=(prevT+' '+(r._t||'')).trim().slice(-500);r._t='';};
 r.onresult=ev=>{if(rec!==r||sent)return;const rs=Array.from(ev.results),last=rs[rs.length-1],base=(prevT+' '+rs.slice(0,-1).map(x=>x[0].transcript).join(' ')).trim();
  r._t=rs.map(x=>x[0].transcript).join(' ');
  const texts=Array.from(last).map(a=>(base+' '+a.transcript).trim().slice(-600));
  clearTimeout(idle);idle=setTimeout(()=>sendVoice(texts,true),1400);
  const n=Date.now();if(texts[0]!==lastV&&n-lastT>250){lastV=texts[0];lastT=n;sendVoice(texts,false);}};
 r.onerror=ev=>{if(rec!==r)return;keep();
  if(['not-allowed','service-not-allowed','audio-capture'].includes(ev.error)){want=false;listening=false;err=ev.error==='audio-capture'?'ما لقيت ميكروفون':'فعّل صلاحية الميكروفون من المتصفح';if(S)render();}
  else listening=false;};
 r.onend=()=>{if(rec!==r)return;keep();listening=false;};
 try{r.start();}catch(e){listening=false;}}
let ac;function tone(f,t,d){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+t;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.25,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d);}catch(e){}}
function sound(m){if(m.buzzer&&m.buzzer!==prev.b)tone(880,0,.3);
 if(m.msg&&m.msg!==prev.m){if(m.msg.includes('✅'))[523,659,784].forEach((f,i)=>tone(f,i*.12,.25));else if(m.msg.includes('❌')){tone(190,0,.3);tone(130,.25,.4);}else if(m.msg.includes('🏆'))[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.14,.3));}
 prev={b:m.buzzer,m:m.msg};}
const SAMPLE='# معلومات عامة\nما هي عاصمة فرنسا؟ | تلميح: فيها برج مشهور | خيارات: باريس، روما، مدريد | إجابة: باريس | صعوبة: سهل\nمن اخترع المصباح الكهربائي؟ | تلميح: أمريكي | خيارات: إديسون، نيوتن، تسلا | إجابة: إديسون / توماس إديسون | صعوبة: متوسط\n# أرقام\nكم عدد أيام السنة الكبيسة؟ | تلميح: أكثر من العادية بيوم | خيارات: 365، 366، 364 | إجابة: 366 | صعوبة: صعب';
function render(){const a=$('app'),qv=$('qs')?$('qs').value:null,av=$('ans')?$('ans').value:'',nm=$('nm')?$('nm').value:'',cd=$('cd')?$('cd').value:'';
 if(!S){a.innerHTML=`<h1>🔔 الحكم الإلكتروني</h1><div class="card"><input id="nm" maxlength="14" placeholder="اسمك" value="${esc(nm||localStorage.name||'')}"></div>
 <button id="cr">إنشاء غرفة جديدة</button><div class="card row"><input id="cd" inputmode="numeric" maxlength="4" placeholder="رمز الغرفة" value="${esc(cd)}"><button id="jn" class="g">دخول</button></div><div class="err">${esc(err)}</div>${inst?'<button class="g" id="ins">📲 ثبّت اللعبة كتطبيق</button>':(/iphone|ipad/i.test(navigator.userAgent)&&!navigator.standalone?'<div class="mute" style="text-align:center">للتثبيت على الآيفون: زر المشاركة ثم «إضافة إلى الشاشة الرئيسية»</div>':'')}`;
  const nmv=()=>{const v=$('nm').value.trim();if(!v){err='اكتب اسمك أولاً';render();return null;}localStorage.name=v;return v;};
  if($('ins'))$('ins').onclick=async()=>{inst.prompt();await inst.userChoice;inst=null;render();};
  $('cr').onclick=()=>{const v=nmv();if(v)tx({t:'create',name:v});};$('jn').onclick=()=>{const v=nmv();if(v)tx({t:'join',code:$('cd').value.trim(),name:v});};return;}
 const isH=S.me===S.host,mine=S.players.find(p=>p.id===S.me)||{},ph=S.phase;
 const board=`<div class="sb">${S.players.map(p=>`<div class="pl ${p.id===S.me?'me':''} ${p.id===S.buzzer?'buz':''} ${p.on?'':'off'}"><span>${esc(p.name)}${p.id===S.host?' 👑':''}${p.spec?' 👁':''}${ph==='lobby'?(p.ready?' ✅':''):' <small class="mute">💡'+p.helps+'</small>'}</span>${ph==='lobby'?'':'<b>'+p.score+'</b>'}</div>`).join('')}</div>`;
 let h=`<div class="err">${esc(err)}</div>`;
 if(ph==='lobby'){h=`<h1>🔔 الغرفة</h1><div class="card"><div class="mute" style="text-align:center">رمز الغرفة (والرابط نفسه للأصدقاء)</div><div class="code">${esc(S.code)}</div></div>${board}
  ${isH?`<textarea id="qs" placeholder="الأسئلة">${esc(qv!==null?qv:(S.qtext||SAMPLE))}</textarea><div class="mute">فيه صيغة: # فئة، وبعدها سؤال | تلميح: | خيارات: | إجابة: | صعوبة: سهل/متوسط/صعب</div><button id="st">ابدأ المباراة</button>`:`<button id="rd" class="${mine.ready?'g':''}">${mine.ready?'إلغاء الجاهزية':'جاهز ✅'}</button><div class="mute" style="text-align:center">بانتظار صاحب الغرفة…</div>`}
  <button class="g" id="lv">مغادرة الغرفة</button><div class="err">${esc(err)}</div>`;}
 else if(ph==='ended'){const r=S.players.slice().sort((a,b)=>b.score-a.score);h=`<h1>${esc(S.msg)}</h1>${r.map((p,i)=>`<div class="pl"><span>${i+1}. ${esc(p.name)}</span><b>${p.score}</b></div>`).join('')}${isH?'<button id="ag">رجوع للغرفة</button>':'<div class="mute" style="text-align:center">بانتظار صاحب الغرفة</div>'}<button class="g" id="lv">مغادرة</button>`;}
 else{const q=S.q,B=S.buzzer,bn=B?(S.players.find(p=>p.id===B)||{}).name:'';
  h=board+`<div class="mute" style="text-align:center">سؤال ${S.n} من ${S.nq}${mine.spec?' · أنت مشاهد':''}</div><div class="card"><div class="cat">${esc(q.cat)}${q.cat?' · ':''}${esc(q.diff)}</div><div class="q">${esc(q.text)}</div></div>`+(tts?`<div class="err">${esc(tts)}</div>`:'')+(window.speechSynthesis?'<button class="g" id="rp">🔊 اسمع السؤال</button>':'');
  if(ph==='question'||ph==='reading'){h+=(mine.spec||mine.tried)?`<div class="big mute">${mine.tried?'جاوبت غلط، انتظر غيرك':'مشاهدة'}</div>`:(ph==='reading'?'<button class="bell" disabled>🔊 يُقرأ السؤال…</button>':'<button class="bell" id="bz">🔔 جرس!</button>');if(isH)h+='<button class="g" id="nx">تخطي السؤال</button>';if(S.msg)h+=`<div class="big">${esc(S.msg)}</div>`;}
  if(ph==='answering'){h+=`<div class="big">🔔 ${esc(bn)} <span id="tm"></span></div>`;
   if(B===S.me){h+=`<div class="row"><button class="g" id="hh" ${S.help||mine.helps<1||!q.hasHint?'disabled':''}>💡 تلميح</button><button class="g" id="ho" ${S.help||mine.helps<1||!q.hasOpts?'disabled':''}>📋 خيارات</button></div>`;
    if(S.hint)h+=`<div class="card big">💡 ${esc(S.hint)}</div>`;
    if(S.opts)h+=`<div class="row">${S.opts.map((o,i)=>`<button class="chip" data-o="${i}">${esc(o)}</button>`).join('')}</div>`;
    h+='<div class="mute" style="text-align:center">احكي بحرية، وجوابك لازم يبدأ بكلمة «الإجابة…». أو اكتبه، وأي وحدة صح بتنحسب</div><div class="row"><input id="ans" placeholder="اكتب جوابك" autocomplete="off"><button id="sd" style="flex:0 0 auto">إرسال</button></div>'+(SR?'<button class="g" id="mic">🎤 '+(want?'المايك شغّال (اضغط للإيقاف)':'جاوب بصوتك')+'</button>':'');}}
  if(ph==='judging'){h+=`<div class="card big">${esc(bn)} جاوب: «${esc(S.said)}»</div>`;h+=(B===S.me||mine.spec)?'<div class="mute" style="text-align:center">الباقي يصوّتوا…</div>':(S.voted?'<div class="mute" style="text-align:center">تم تصويتك</div>':'<div class="row"><button class="ok" id="vy">✅ صح</button><button class="bad" id="vn">❌ غلط</button></div>');}
  if(ph==='result'){h+=`<div class="big">${esc(S.msg)}</div>${S.reveal?`<div class="card big">✅ ${esc(S.reveal)}</div>`:''}${isH?'<button id="nx">السؤال التالي</button>':'<div class="mute" style="text-align:center">بانتظار صاحب الغرفة</div>'}`;}
  h+=`<div class="row"><button class="g" id="tg1">${pr.speak?'🔊 القراءة: شغّال':'🔇 القراءة: مطفأ'}</button>${SR?`<button class="g" id="tg2">${pr.mic?'🎤 الصوت عند الجرس: شغّال':'🎤 الصوت عند الجرس: مطفأ'}</button>`:''}</div><button class="g" id="lv">مغادرة</button>`;}
 a.innerHTML=h;if($('ans')){$('ans').value=av;$('ans').focus();}
 const on=(i,f)=>{const e=$(i);if(e)e.onclick=f;};
 on('st',()=>{tx({t:'qs',text:$('qs').value});tx({t:'start'});});on('rd',()=>tx({t:'ready'}));on('bz',()=>{tx({t:'buzz'});if(pr.mic)listen();});on('clr',()=>{$('ans').value='';listen();render();});on('mic',()=>{if(want)stopMic();else listen();render();});on('rp',()=>speakQ(S.q.text,true));on('tg1',()=>{pr.speak=!pr.speak;localStorage.sp=pr.speak?1:0;if(!pr.speak&&window.speechSynthesis)speechSynthesis.cancel();render();});on('tg2',()=>{pr.mic=!pr.mic;localStorage.mc=pr.mic?1:0;render();});on('nx',()=>tx({t:'next'}));on('ag',()=>tx({t:'again'}));
 on('hh',()=>tx({t:'help',k:'hint'}));on('ho',()=>tx({t:'help',k:'opts'}));on('vy',()=>tx({t:'vote',ok:true}));on('vn',()=>tx({t:'vote',ok:false}));
 on('sd',()=>{stopMic();const v=$('ans').value.trim();if(v)tx({t:'answer',text:v});});
 on('lv',()=>{tx({t:'leave'});localStorage.removeItem('code');code='';S=null;render();});
 if($('ans'))$('ans').onkeydown=e=>{if(e.key==='Enter'){stopMic();const v=$('ans').value.trim();if(v)tx({t:'answer',text:v});}};
 document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>tx({t:'answer',text:b.textContent}));}
setInterval(()=>{if(want&&!sent&&!listening&&S&&S.phase==='answering'&&S.buzzer===S.me&&Date.now()>retryAt){retryAt=Date.now()+500;listen(true);}
const t=$('tm');if(t&&S&&S.phase==='answering')t.textContent='⏱ '+Math.max(0,Math.ceil((dl-Date.now())/1000));},250);
connect();render();
</script></body></html>
